# 참고 URL: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github?hl=ko#styleguide.md

have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
ignore_patterns: ['*.md']
