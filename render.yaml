# Render 배포 설정 파일
# 참고: https://render.com/docs/yaml-spec

services:
  - type: web
    name: codte-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false  # Render 대시보드에서 직접 설정
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Render 대시보드에서 직접 설정
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.0"
